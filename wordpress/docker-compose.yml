# Local test bench for the theme and plugin: docker compose up -d, then http://localhost:8088
name: brobobber-wp
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30
  wordpress:
    image: wordpress:7.1.5-php8.3-apache
    depends_on: { db: { condition: service_healthy } }
    ports: ["8088:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - site:/var/www/html
      - ./brobobber:/var/www/html/wp-content/themes/brobobber
      - ./brobobber-core:/var/www/html/wp-content/plugins/brobobber-core
      - ./dist/media:/var/www/html/wp-content/uploads/brobobber-import:ro
  cli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    user: "33:33"
    depends_on: [wordpress]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - site:/var/www/html
      - ./brobobber:/var/www/html/wp-content/themes/brobobber
      - ./brobobber-core:/var/www/html/wp-content/plugins/brobobber-core
      - ./dist/media:/var/www/html/wp-content/uploads/brobobber-import:ro
volumes: { db: {}, site: {} }
