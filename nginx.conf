server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prerendered pages are saved as /path.html; the address has no extension.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location /_app/immutable/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        try_files $uri =404;
        expires 30d;
    }

    error_page 404 /404.html;
}
